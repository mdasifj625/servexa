version: '3.8'

services:
  db:
    image: postgres:15
    container_name: servexa_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: servexa
    ports:
      - '5433:5432'
    volumes:
      - servexa_pgdata:/var/lib/postgresql/data

volumes:
  servexa_pgdata:
